<!DOCTYPE html>
<html>
<head><title>Speech Relay</title></head>
<body>
<script>
    let mediaRecorder = null;
    let audioChunks = [];

    window.addEventListener('message', async (event) => {
        if (event.data.action === 'start') {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => {
                        // Send base64 audio snippet back to FiveM
                        window.parent.postMessage({ type: 'audio_snippet', base64: reader.result }, '*');
                    };
                    // Stop tracks to release mic
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                window.parent.postMessage({ type: 'status', text: 'recording' }, '*');
            } catch (err) {
                window.parent.postMessage({ type: 'speech_error', error: err.message }, '*');
            }
        } 
        else if (event.data.action === 'stop') {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }
    });
</script>
</body>
</html>
